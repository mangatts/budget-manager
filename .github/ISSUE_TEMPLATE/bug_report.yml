name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Security problem?** Don't file it here. Use Security → Report a vulnerability. **Never paste real financial data.**"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & browser
      placeholder: "iPhone 15, Safari / MacBook, Chrome 140"
  - type: dropdown
    id: data
    attributes:
      label: Was any data lost?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
